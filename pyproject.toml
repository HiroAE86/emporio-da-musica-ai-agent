[project]
name = "emporio-da-musica-ai-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pypdf>=5,<7"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["tools/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
extend-select = ["I", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
